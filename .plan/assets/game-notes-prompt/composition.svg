<text x="250" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">planner 가 매 호출 읽는 프롬프트</text>
<rect x="64" y="94" width="372" height="78" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="250" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">① 시스템 프롬프트</text>
