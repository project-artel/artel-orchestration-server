<text x="250" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">③ 게임별 노트</text>
<text x="250" y="325" text-anchor="middle" font-size="12" fill="#854F0B">이 게임만의 사실 (조작 · 규칙 · 화면 흐름)</text>
<text x="250" y="344" text-anchor="middle" font-size="12" fill="#854F0B">작성: 사용자 (게임을 만든 사람) · 프로젝트별 버전</text>
