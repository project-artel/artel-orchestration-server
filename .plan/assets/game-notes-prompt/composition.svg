<rect x="150" y="512" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="170" y="524" font-size="12" fill="#444441">Artel 이 작성 (데이터 수집)</text>
<rect x="360" y="512" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="380" y="524" font-size="12" fill="#444441">사용자가 작성</text>
<rect x="490" y="512" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9"/><text x="510" y="524" font-size="12" fill="#444441">엔진이 자동으로</text>
