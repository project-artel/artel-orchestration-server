<text x="250" y="160" text-anchor="middle" font-size="12" fill="#534AB7">작성: Artel (데이터 수집으로) · 고정</text>
<rect x="64" y="186" width="372" height="78" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="250" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">② 장르 프롬프트 (ui-flow, turn-based …)</text>
<text x="250" y="233" text-anchor="middle" font-size="12" fill="#534AB7">그 장르 게임에 공통인 구조 · 패턴</text>
<text x="250" y="252" text-anchor="middle" font-size="12" fill="#534AB7">작성: Artel (데이터 수집으로) · 사용자는 고르기만</text>
