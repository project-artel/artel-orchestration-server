spring:
  config:
    import:
      - optional:classpath:application-db.yml
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

logging:
  level:
    org:
      springframework:
        web: DEBUG
        web.reactive: DEBUG

artel:
  agent:
    base-url: ${ARTEL_AGENT_BASE_URL:http://localhost:8000}
    ws-base-url: ${ARTEL_AGENT_WS_BASE_URL:ws://localhost:8000}
  auth:
    frontend-url: ${ARTEL_HOME_URL:http://localhost:5173}
    # CORS 허용 origin(콤마 구분). frontend-url은 항상 자동 포함된다. 와일드카드(https://*.artel.kr) 허용.
    allowed-origins: ${ARTEL_ALLOWED_ORIGINS:https://home.stage.artel.kr,https://artel.kr,https://www.artel.kr}
    issuer: ${ARTEL_JWT_ISSUER:artel-orchestration-server}
    audience: ${ARTEL_JWT_AUDIENCE:artel-home}
    jwt-secret: ${ARTEL_JWT_SECRET}
    access-token-ttl: ${ARTEL_JWT_TTL:PT15M}
    cookie-name: ${ARTEL_AUTH_COOKIE:artel_access_token}
    secure-cookie: ${ARTEL_SECURE_COOKIE:true}
  storage:
    # 기획서 원본을 담을 S3.
    bucket: ${ARTEL_S3_BUCKET:artel-local}
    region: ${ARTEL_S3_REGION:ap-northeast-2}
    # 로컬 MinIO 등으로 돌릴 때만 지정한다. 빈 값은 "지정하지 않음"으로 읽힌다.
    # (@ConfigurationProperties 바인딩은 SpEL을 처리하지 않아 #{null}을 쓸 수 없다.)
    endpoint: ${ARTEL_S3_ENDPOINT:}
    # 선택. 비워 두면 AWS 기본 제공자 체인을 쓰고, 그마저 없으면 서명 없이 보낸다
    # (버킷이 익명 접근을 허용할 때만 통한다).
    # spring-dotenv는 .env를 Spring Environment에만 넣고 프로세스 환경변수로 만들지 못해,
    # .env에 AWS_ACCESS_KEY_ID를 적어도 AWS SDK는 보지 못한다. 그래서 이 두 키로 받는다.
    access-key: ${ARTEL_S3_ACCESS_KEY:}
    secret-key: ${ARTEL_S3_SECRET_KEY:}
    upload-url-ttl: ${ARTEL_S3_UPLOAD_URL_TTL:PT10M}
    download-url-ttl: ${ARTEL_S3_DOWNLOAD_URL_TTL:PT5M}
    max-upload-bytes: ${ARTEL_UPLOAD_MAX_BYTES:52428800}
