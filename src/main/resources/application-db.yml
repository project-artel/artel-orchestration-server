spring:
  # 앱 런타임: R2DBC (논블로킹)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:artel}?sslMode=${DB_SSL_MODE:prefer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  # 스키마 마이그레이션: Flyway는 JDBC로만 동작하므로 JDBC URL을 별도 지정한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:artel}?sslmode=${DB_SSL_MODE:prefer}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    locations: classpath:db/migration
