# 스위트가 동시에 살려 둘 수 있는 Spring 컨텍스트 수.
#
# 기본값은 32다. 넘으면 스프링이 **가장 오래 안 쓴 컨텍스트를 닫는다** — 그런데 닫힌 컨텍스트를
# 쓰던 테스트 클래스는 그 사실을 모른 채 `@LocalServerPort` 로 받아 둔 포트로 요청을 보내고,
# `Connection refused` 로 죽는다. 죽는 것은 컨텍스트를 늘린 테스트가 아니라 **아무 상관 없는
# 다른 테스트**라, 원인을 찾는 데 드는 값이 크다.
#
# 실측: 컨텍스트 변형이 29개일 때는 전부 통과했고, 33개가 되자 `ProjectCrudIntegrationTest` ·
# `ProjectMemberIntegrationTest` 등 여섯 클래스가 통째로 `Connection refused` 를 냈다. 새로
# 더한 테스트는 그 여섯과 아무 관계가 없다.
#
# 컨텍스트 하나가 커넥션 풀을 잡는 값은 `application-test.yml` 이 이미 작게 눌러 두었으므로
# (거기 주석에 이유가 있다), 여기서 상한을 올리는 비용은 메모리뿐이다.
#
# 이 파일이어야 하는 이유: 이 값은 `SpringProperties` 가 읽는다. `application-test.yml` 에 적으면
# 스프링 부트 환경이 뜨기 전에 읽히는 값이라 **조용히 무시된다.**
spring.test.context.cache.maxSize=64
