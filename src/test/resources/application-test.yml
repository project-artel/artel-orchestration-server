spring:
  # 테스트도 실제 로컬 PostgreSQL(개발자가 띄워둔 DB)을 사용한다. H2는 JSONB를 지원하지 않으므로
  # payload(JSONB) 검증을 위해 실 DB에 맞춘다.
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  # 스키마는 Flyway(JDBC)가 구성한다. 볼륨 없는 Docker 컨테이너를 재구동하면 빈 DB가 되고,
  # 부팅 시 Flyway가 마이그레이션을 새로 적용해 스키마가 초기화된다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    locations: classpath:db/migration
    clean-disabled: false
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-github-client
            client-secret: test-github-secret

artel:
  agent:
    base-url: http://localhost:8000
    ws-base-url: ws://localhost:8000
  auth:
    frontend-url: http://localhost:5173
    issuer: artel-orchestration-server-test
    audience: artel-home-test
    jwt-secret: test-only-secret-that-is-at-least-32-bytes-long
    access-token-ttl: PT15M
    cookie-name: artel_access_token
    secure-cookie: false
