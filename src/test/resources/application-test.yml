spring:
  # 앱 런타임: R2DBC H2 (인메모리)
  r2dbc:
    url: r2dbc:h2:mem:///testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  # 마이그레이션: Flyway는 JDBC H2로 실행. R2DBC와 동일한 인메모리 DB(testdb)를 가리켜야
  # Flyway가 만든 스키마를 R2DBC 쿼리가 볼 수 있다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    user: sa
    password:
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-github-client
            client-secret: test-github-secret

artel:
  agent:
    base-url: http://localhost:8000
    ws-base-url: ws://localhost:8000
  auth:
    frontend-url: http://localhost:5173
    issuer: artel-orchestration-server-test
    audience: artel-home-test
    jwt-secret: test-only-secret-that-is-at-least-32-bytes-long
    access-token-ttl: PT15M
    cookie-name: artel_access_token
    secure-cookie: false
